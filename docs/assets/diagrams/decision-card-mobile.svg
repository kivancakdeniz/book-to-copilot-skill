<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-label="Anatomy of a governed decision card">
  <style>
    .bg{fill:#fff}.sheet{fill:#fff;stroke:#d7dced;stroke-width:1.5}.row{fill:#f7f9ff;stroke:#e1e7f7;stroke-width:1}.pill{fill:#eef9f4;stroke:#9dd8be;stroke-width:1.2}.gate{fill:#fff6f3;stroke:#f0bda8;stroke-width:1.2}.title{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17203a}.body{font:15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4a5573}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2f3a5c}.kicker{font:700 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6b76a0;letter-spacing:.08em}.note{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6b76a0}
    @media(prefers-color-scheme:dark){.bg{fill:#131828}.sheet{fill:#161b2e;stroke:#2c3550}.row{fill:#1b2136;stroke:#2c3550}.pill{fill:#12261f;stroke:#2f5f49}.gate{fill:#2a1c18;stroke:#6b4636}.title{fill:#eef1fa}.body{fill:#a9b3d0}.mono{fill:#cdd6f0}.kicker,.note{fill:#8b96c4}}
  </style>
  <rect class="bg" width="360" height="600" rx="18"/>
  <rect class="sheet" x="16" y="16" width="328" height="568" rx="16"/>
  <text class="kicker" x="36" y="48">DECISION CARD</text>
  <rect class="pill" x="36" y="66" width="288" height="42" rx="12"/><text class="mono" x="52" y="92">revise-before-launch</text>
  <rect class="pill" x="36" y="118" width="288" height="42" rx="12"/><text class="mono" x="52" y="144">separate-notice-and-consent</text>
  <text class="kicker" x="36" y="194">RULE-BY-RULE TRACE</text>
  <rect class="row" x="36" y="208" width="288" height="54" rx="10"/><text class="mono" x="50" y="230">KVK-C01</text><text class="body" x="50" y="250">Field inventory missing → blocked</text>
  <rect class="row" x="36" y="270" width="288" height="54" rx="10"/><text class="mono" x="50" y="292">KVK-T01</text><text class="body" x="50" y="312">Transfer route unknown → evidence</text>
  <rect class="row" x="36" y="332" width="288" height="54" rx="10"/><text class="mono" x="50" y="354">KVK-R01</text><text class="body" x="50" y="374">Rights channel absent → revise</text>
  <text class="kicker" x="36" y="420">AUTHORITY STAYS HUMAN</text>
  <rect class="gate" x="36" y="434" width="288" height="94" rx="10"/><text class="body" x="50" y="460">Decision owner:</text><text class="title" x="50" y="484">Privacy Counsel</text><text class="body" x="50" y="507">Assistant cannot launch, consent,</text><text class="body" x="50" y="525">transfer, publish, or approve.</text>
  <text class="note" x="36" y="558">Exact class · cited rules · named human</text>
</svg>
