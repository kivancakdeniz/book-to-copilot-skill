<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img"
     aria-label="Anatomy of a governed decision card produced by a skill">
  <style>
    .bg { fill: #ffffff }
    .sheet { fill: #ffffff; stroke: #d7dced; stroke-width: 1.5 }
    .row { fill: #f7f9ff; stroke: #e1e7f7; stroke-width: 1 }
    .pill { fill: #eef9f4; stroke: #9dd8be; stroke-width: 1.2 }
    .gate { fill: #fff6f3; stroke: #f0bda8; stroke-width: 1.2 }
    .title { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17203a }
    .body { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a5573 }
    .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2f3a5c }
    .kicker { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b76a0; letter-spacing: .08em }
    .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b76a0 }
    .lead { stroke: #c3cbe6; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #131828 }
      .sheet { fill: #161b2e; stroke: #2c3550 }
      .row { fill: #1b2136; stroke: #2c3550 }
      .pill { fill: #12261f; stroke: #2f5f49 }
      .gate { fill: #2a1c18; stroke: #6b4636 }
      .title { fill: #eef1fa }
      .body { fill: #a9b3d0 }
      .mono { fill: #cdd6f0 }
      .kicker, .note { fill: #8b96c4 }
      .lead { stroke: #3a4573 }
    }
  </style>

  <rect class="bg" width="960" height="320" rx="18"/>
  <rect class="sheet" x="16" y="16" width="560" height="288" rx="16"/>

  <text class="kicker" x="44" y="52">DECISION CARD</text>

  <rect class="pill" x="44" y="66" width="212" height="34" rx="17"/>
  <text class="mono" x="60" y="88">revise-before-launch</text>

  <rect class="pill" x="266" y="66" width="252" height="34" rx="17"/>
  <text class="mono" x="282" y="88">separate-notice-and-consent</text>

  <rect class="row" x="44" y="116" width="474" height="30" rx="8"/>
  <text class="mono" x="58" y="136">KVK-C01</text>
  <text class="body" x="150" y="136">field inventory missing → blocked</text>

  <rect class="row" x="44" y="152" width="474" height="30" rx="8"/>
  <text class="mono" x="58" y="172">KVK-T01</text>
  <text class="body" x="150" y="172">transfer route unknown → evidence needed</text>

  <rect class="row" x="44" y="188" width="474" height="30" rx="8"/>
  <text class="mono" x="58" y="208">KVK-R01</text>
  <text class="body" x="150" y="208">rights channel absent → revise notice</text>

  <rect class="gate" x="44" y="230" width="474" height="52" rx="10"/>
  <text class="body" x="60" y="252">Human decision owner: Privacy Counsel, Data Protection</text>
  <text class="body" x="60" y="271">The assistant does not launch, consent, transfer, or approve.</text>

  <path class="lead" d="M576 83 H636"/>
  <path class="lead" d="M576 167 H636"/>
  <path class="lead" d="M576 256 H636"/>

  <text class="title" x="648" y="76">Exact decision class</text>
  <text class="note" x="648" y="96">One allowed value, never free prose</text>

  <text class="title" x="648" y="160">Rule-by-rule trace</text>
  <text class="note" x="648" y="180">Each row cites the policy identifier</text>
  <text class="note" x="648" y="198">and what evidence is still missing</text>

  <text class="title" x="648" y="249">Authority stays human</text>
  <text class="note" x="648" y="269">Named owner and an explicit limit</text>
  <text class="note" x="648" y="287">on what the assistant may do</text>
</svg>
