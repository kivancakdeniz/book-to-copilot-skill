<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-label="Evaluation: one locked case, two runs, one deterministic scorer">
  <style>
    .bg{fill:#fff}.card{fill:#fff;stroke:#d7dced;stroke-width:1.5}.control{fill:#fff6f3;stroke:#f0bda8;stroke-width:1.5}.treatment{fill:#eef9f4;stroke:#9dd8be;stroke-width:1.5}.scorer{fill:#f4f6ff;stroke:#b9c4ef;stroke-width:1.5}.title{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17203a}.body{font:15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4a5573}.kicker{font:700 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6b76a0;letter-spacing:.08em}.score{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17203a}.flow{stroke:#9aa6cc;stroke-width:2;fill:none;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.bg{fill:#131828}.card{fill:#161b2e;stroke:#2c3550}.control{fill:#2a1c18;stroke:#6b4636}.treatment{fill:#12261f;stroke:#2f5f49}.scorer{fill:#1a2140;stroke:#3a4573}.title,.score{fill:#eef1fa}.body{fill:#a9b3d0}.kicker{fill:#8b96c4}.flow{stroke:#6a769e}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9aa6cc"/></marker></defs>
  <rect class="bg" width="360" height="600" rx="18"/>
  <g><rect class="card" x="20" y="20" width="320" height="96" rx="14"/><text class="kicker" x="40" y="48">LOCKED INPUT</text><text class="title" x="40" y="76">One case, one prompt</text><text class="body" x="40" y="101">Expected answer stays hidden</text></g>
  <path class="flow" d="M180 118v28"/>
  <g><rect class="control" x="20" y="150" width="320" height="86" rx="14"/><text class="kicker" x="40" y="178">CONTROL</text><text class="title" x="40" y="205">Model only</text><text class="body" x="184" y="205">No company policy</text></g>
  <path class="flow" d="M180 238v28"/>
  <g><rect class="treatment" x="20" y="270" width="320" height="86" rx="14"/><text class="kicker" x="40" y="298">TREATMENT</text><text class="title" x="40" y="325">Model + skill</text><text class="body" x="184" y="325">Policy and schema load</text></g>
  <path class="flow" d="M180 358v28"/>
  <g><rect class="scorer" x="20" y="390" width="320" height="92" rx="14"/><text class="kicker" x="40" y="418">DETERMINISTIC</text><text class="title" x="40" y="445">Scorer, not a judge</text><text class="body" x="40" y="468">Rules · decision · option · human route</text></g>
  <path class="flow" d="M180 484v28"/>
  <g><rect class="card" x="20" y="516" width="320" height="66" rx="14"/><text class="kicker" x="40" y="542">MEAN TRACE SCORE</text><text class="score" x="190" y="557">33</text><text class="body" x="232" y="557">control</text><text class="score" x="190" y="580">95</text><text class="body" x="232" y="580">skill</text></g>
</svg>
