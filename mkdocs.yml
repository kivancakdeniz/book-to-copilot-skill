site_name: book-to-copilot-skill
site_description: Compile business guidance into governed, evaluated Copilot skills.
site_url: https://kivancakdeniz.github.io/book-to-copilot-skill/
repo_url: https://github.com/kivancakdeniz/book-to-copilot-skill
repo_name: kivancakdeniz/book-to-copilot-skill
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: tr
          name: Türkçe
          build: true
          site_description: Kurumsal rehberleri denetlenebilir ve değerlendirilmiş Agent Skill'lere dönüştürün.
          nav_translations:
            Overview: Genel bakış
            Create a skill: Agent Skill oluştur
            Examples: Örnekler
            Safety & reuse: Güvenlik ve yeniden kullanım
  - search

nav:
  - Overview: index.md
  - Create a skill: create-a-skill.md
  - Examples: skills/index.md
  - Safety & reuse: safety.md

extra_css:
  - assets/site.css

extra_javascript:
  - assets/site.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
